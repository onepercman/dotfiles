# ── General ──────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# ── Prefix ───────────────────────────────────────────────────────────────────

set -g prefix C-b

# ── Splits & panes ───────────────────────────────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# ── Theme (native ANSI palette, adapts to terminal theme) ───────────────────

set -g status-style "fg=white,bg=black"
set -g status-left-length 20
set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=white,bg=black] "
set -g status-right "%Y-%m-%d #[fg=black,bg=magenta,bold] %H:%M "

setw -g window-status-current-style "fg=black,bg=blue,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=white,bg=black"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

set -g mode-style "fg=black,bg=blue"

set -g message-style "fg=black,bg=blue"
set -g message-command-style "fg=black,bg=blue"
