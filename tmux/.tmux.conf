# ── General ──────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g mouse on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g history-limit 10000

# ── Prefix ───────────────────────────────────────────────────────────────────

set -g prefix C-b

# ── Splits & panes ───────────────────────────────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# ── Theme (native ANSI palette, adapts to terminal theme) ───────────────────

set -g status-interval 1
set -g status-justify centre
set -g status-style "fg=white,bg=black"
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#[fg=black,bg=blue,bold] #S:#I.#P #[fg=blue,bg=brightblack] #(whoami) #[fg=brightblack,bg=black]#[fg=white,bg=black] "
set -g status-right "#[fg=blue,bg=black]#[fg=black,bg=blue,bold] #h "

setw -g window-status-current-format "#[fg=blue,bg=black]#[fg=black,bg=blue,bold]#I #[fg=blue,bg=brightblack] #{b:pane_current_path} #[fg=brightblack,bg=black]"
setw -g window-status-format "#[fg=black,bg=black]#[fg=white,bg=black]#I#[fg=white,bg=black] #{b:pane_current_path} #[fg=black,bg=black]"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

set -g mode-style "fg=black,bg=blue"

set -g message-style "fg=black,bg=blue"
set -g message-command-style "fg=black,bg=blue"
