# ── General ──────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# ── Prefix ───────────────────────────────────────────────────────────────────

set -g prefix C-b

# ── Splits & panes ───────────────────────────────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# ── Theme (native ANSI palette, adapts to terminal theme) ───────────────────

set -g status-style "fg=white,bg=default"
set -g status-left-length 20
set -g status-left "#[fg=cyan,bold] #S #[fg=default]"
set -g status-right "#[fg=blue]%Y-%m-%d #[fg=cyan]%H:%M "

setw -g window-status-current-style "fg=cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=white"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=cyan"

set -g message-style "fg=cyan,bg=default"
