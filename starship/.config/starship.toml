"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$character\
"""

# -----------------------------
# OS
# -----------------------------
[os]
disabled = false
style = "bold white"
format = '[ $symbol]($style)'

[os.symbols]
Macos = ""
Ubuntu = ""
Windows = "󰍲"
Arch = ""
Fedora = ""
Debian = ""

# -----------------------------
# USERNAME
# -----------------------------
[username]
show_always = false
style_user = "white"
style_root = "white"
format = '[ $user]($style)'
disabled = false

# -----------------------------
# DIRECTORY
# -----------------------------
[directory]
style = "cyan"
format = '[ $path]($style)'
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 0
use_os_path_sep = true
home_symbol = "~"
truncation_symbol = ""

[directory.substitutions]
"Developer" = " Developer"
"Projects" = "󱌣 Projects"
"Workspace" = "󱂬 Workspace"
"Code" = "󰨞 Code"
"Repos" = "󰳏 Repos"
"Documents" = "󱂷 Documents"
"Downloads" = "󰉍 Downloads"
"Music" = "󱍙 Music"
"Pictures" = "󰉏 Pictures"
"Desktop" = "󰟀 Desktop"
"dotfiles" = " dotfiles"
".config" = "󱁿 .config"
".git" = "󰊢 .git"

# -----------------------------
# GIT
# -----------------------------
[git_branch]
symbol = ""
style = "purple"
format = '[ $symbol $branch]($style)'

[git_status]
format = '([$staged$modified$untracked$renamed$deleted$conflicted$stashed$ahead_behind]($style))'

staged = '[ +${count}](bold green)'
modified = '[ !${count}](bold yellow)'
untracked = '[ ?${count}](bold cyan)'
deleted = '[ ✘${count}](bold red)'
renamed = '[ →](bold blue)'
conflicted = '[ ⚑](bold purple)'
stashed = '[ ≡${count}](bold bright-purple)'

ahead = '[ ⇡${count}](bold green)'
behind = '[ ⇣${count}](bold red)'
diverged = '[ ⇕⇡${ahead_count}⇣${behind_count}](bold bright-yellow)'

# -----------------------------
# LANGUAGE RUNTIMES (mise-managed)
# no pill, plain ANSI-colored text, transparent background
# -----------------------------
[nodejs]
style = "green"
format = ' [$symbol$version]($style)'

[bun]
style = "bright-yellow"
format = ' [$symbol$version]($style)'

[python]
style = "blue"
format = ' [$symbol$version]($style)'

[rust]
style = "bright-red"
format = ' [$symbol$version]($style)'

[golang]
style = "bright-cyan"
format = ' [$symbol$version]($style)'

# -----------------------------
# DOCKER
# -----------------------------
[docker_context]
symbol = ""
style = "blue"
format = ' [$symbol $context]($style)'

# -----------------------------
# COMMAND DURATION
# -----------------------------
[cmd_duration]
min_time = 2_000
format = ' [$duration]($style)'
style = "bright-blue"

# -----------------------------
# CHARACTER (prompt symbol)
# -----------------------------
[character]
format = "$symbol "
success_symbol = ' [](bold green)'
error_symbol = ' [](bold red)'
vimcmd_symbol = ' [](bold green)'
