##############################################
#                                            #
#                 Nord Theme                #
#                                            #
##############################################

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

# Palette matches the Nord colors used elsewhere in this repo
# (ghostty, nvim, starship) for a consistent look across tools.

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "nord"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#d8dee9"
full_screen_bg = "#2e3440"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#88c0d0", "#bf616a"]

#-- File Panel
file_panel_fg = "#d8dee9"
file_panel_bg = "#2e3440"
file_panel_border = "#4c566a"
file_panel_border_active = "#eceff4"
file_panel_top_directory_icon = "#88c0d0"
file_panel_top_path = "#88c0d0"
file_panel_item_selected_fg = "#bf616a"
file_panel_item_selected_bg = "#2e3440"

#-- Footer
footer_fg = "#d8dee9"
footer_bg = "#2e3440"
footer_border = "#4c566a"
footer_border_active = "#b48ead"

#-- Sidebar
sidebar_fg = "#d8dee9"
sidebar_bg = "#2e3440"
sidebar_title = "#88c0d0"
sidebar_border = "#2e3440"
sidebar_border_active = "#b48ead"
sidebar_item_selected_fg = "#8fbcbb"
sidebar_item_selected_bg = "#2e3440"
sidebar_divider = "#4c566a"

#-- Modals
modal_fg = "#d8dee9"
modal_bg = "#2e3440"
modal_border_active = "#4c566a"
modal_cancel_fg = "#d8dee9"
modal_cancel_bg = "#3b4252"
modal_confirm_fg = "#d8dee9"
modal_confirm_bg = "#bf616a"

#-- Help Menu
help_menu_hotkey = "#8fbcbb"
help_menu_title = "#88c0d0"

#-- Special
cursor = "#ebcb8b"
correct = "#a3be8c"
error = "#bf616a"
hint = "#8fbcbb"
cancel = "#d8dee9"
