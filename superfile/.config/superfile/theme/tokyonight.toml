##############################################
#                                            #
#              TokyoNight Theme              #
#                                            #
##############################################

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

# Palette matches the TokyoNight (Night) colors used elsewhere in this repo
# (ghostty, nvim, starship) for a consistent look across tools.

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "tokyonight-night"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#a9b1d6"
full_screen_bg = "#1a1b26"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#7dcfff", "#f7768e"]

#-- File Panel
file_panel_fg = "#a9b1d6"
file_panel_bg = "#1a1b26"
file_panel_border = "#3b4261"
file_panel_border_active = "#c0caf5"
file_panel_top_directory_icon = "#7dcfff"
file_panel_top_path = "#7dcfff"
file_panel_item_selected_fg = "#f7768e"
file_panel_item_selected_bg = "#1a1b26"

#-- Footer
footer_fg = "#a9b1d6"
footer_bg = "#1a1b26"
footer_border = "#3b4261"
footer_border_active = "#bb9af7"

#-- Sidebar
sidebar_fg = "#a9b1d6"
sidebar_bg = "#1a1b26"
sidebar_title = "#7dcfff"
sidebar_border = "#1a1b26"
sidebar_border_active = "#bb9af7"
sidebar_item_selected_fg = "#73daca"
sidebar_item_selected_bg = "#1a1b26"
sidebar_divider = "#3b4261"

#-- Modals
modal_fg = "#a9b1d6"
modal_bg = "#1a1b26"
modal_border_active = "#3b4261"
modal_cancel_fg = "#a9b1d6"
modal_cancel_bg = "#292e42"
modal_confirm_fg = "#a9b1d6"
modal_confirm_bg = "#f7768e"

#-- Help Menu
help_menu_hotkey = "#73daca"
help_menu_title = "#7dcfff"

#-- Special
cursor = "#e0af68"
correct = "#9ece6a"
error = "#f7768e"
hint = "#73daca"
cancel = "#a9b1d6"
